<!-- SECCIÓN DE EXPANSIÓN: CURSO, CANCIONERO Y PROFESOR VIRTUAL -->
<div id="piano-expansion-app" style="font-family: sans-serif; padding: 20px; background: #121212; color: #fff; border-radius: 12px; max-width: 800px; margin: 20px auto;">
    
    <!-- Navegación Superior de Módulos -->
    <div style="display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px;">
        <button onclick="cambiarModulo('curso')" style="background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">📚 Curso (Nv. 1-5)</button>
        <button onclick="cambiarModulo('cancionero')" style="background: #374151; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">🎵 Cancionero</button>
        <button onclick="cambiarModulo('oido')" style="background: #374151; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">👂 Ear Training</button>
        <button onclick="cambiarModulo('profesor')" style="background: #059669; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">🤖 Profesor Virtual</button>
    </div>

    <!-- Contenedor Dinámico -->
    <div id="contenido-modulo">
        <h3>Bienvenido a la expansión de Piano Fácil 🎹</h3>
        <p>Selecciona una pestaña arriba para comenzar a explorar el contenido completo, practicar cumbias y rock, o hacerle preguntas a tu tutor virtual.</p>
    </div>

</div>

<script>
    function cambiarModulo(tipo) {
        const contenedor = document.getElementById('contenido-modulo');
        
        if (tipo === 'curso') {
            contenedor.innerHTML = `
                <h3>📚 Curso Completo de Piano (Niveles 1 al 5)</h3>
                <ul>
                    <li><b>Nivel 1:</b> Postura, Teclas Negras, Cifrado Americano y Dedos 1-5.</li>
                    <li><b>Nivel 2:</b> Inversiones de Acordes y Voice Leading (Enlaces suaves).</li>
                    <li><b>Nivel 3:</b> Ritmo, Compases (4/4 y 3/4) y Síncopas para mano izquierda.</li>
                    <li><b>Nivel 4:</b> Escalas Mayores, Pentatónicas e Improvisación.</li>
                    <li><b>Nivel 5:</b> Acordes Extendidos (9as, maj7), Modulaciones y Pedal de Sustain.</li>
                </ul>`;
        } else if (tipo === 'cancionero') {
            contenedor.innerHTML = `
                <h3>🎵 Cancionero Ampliado</h3>
                <p><b>Cumbia Argentina:</b> "Una Cerveza" (Am), "No Te Creas Tan Importante" (C).</p>
                <p><b>Rock Nacional & Pop:</b> "De Música Ligera" (Bm), "Persiana Americana" (Em), "Let It Be" (C).</p>`;
        } else if (tipo === 'oido') {
            contenedor.innerHTML = `
                <h3>👂 Guías de Entrenamiento Auditivo y Tips</h3>
                <p>• <b>Intervalos:</b> Aprende a reconocer segundas, terceras y quintas de oído.</p>
                <p>• <b>Colores de Acordes:</b> Distingue la alegría del Mayor y la melancolía del Menor.</p>
                <p>• <b>Tip Pro:</b> La velocidad nace de la relajación y el uso correcto del metrónomo.</p>`;
        } else if (tipo === 'profesor') {
            contenedor.innerHTML = `
                <h3>🤖 Profesor Virtual (Tutor IA)</h3>
                <p>¿Tienes dudas con una inversión o una digitación?</p>
                <div style="background: #1e1e1e; padding: 10px; border-radius: 6px; margin-top: 10px;">
                    <p style="color: #10b981; margin: 0;"><b>Tutor:</b> ¡Hola! Estoy listo para ayudarte a practicar hoy. ¿Qué lección o canción te gustaría revisar?</p>
                </div>`;
        }
    }
</script>
