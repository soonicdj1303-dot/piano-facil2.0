<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17202E">
<title>Piano fácil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9EEF4;--ink:#17202E;--mut:#5B6678;--acc:#2457F5;--hint:#FFC23C;--ok:#16A37F;--bad:#E0483E;font-family:Lexend,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;flex-wrap:wrap}
h1{font-size:22px;font-weight:800;margin:0}
h2{font-size:20px;margin:8px 0}
.tg{border:2px solid var(--ink);background:none;border-radius:999px;padding:6px 12px;font-size:13px}
.tg[aria-pressed=true]{background:var(--ink);color:#fff}
nav{display:flex;padding:0 16px;max-width:640px;width:100%;margin:0 auto}
nav button{flex:1;border:0;background:none;font-weight:600;padding:10px 4px;border-bottom:3px solid transparent;color:var(--mut)}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--acc)}
main{flex:1;overflow:auto;padding:8px 16px 16px;max-width:640px;width:100%;margin:0 auto}
.card{display:block;width:100%;text-align:left;background:#fff;border:0;border-radius:10px;padding:14px 16px;margin:0 0 10px;box-shadow:0 1px 0 rgba(23,32,46,.12)}
.card b{display:block;font-size:16px}
.card span{color:var(--mut);font-size:14px}
.card.done{border-left:6px solid var(--ok)}
.info{color:var(--mut);line-height:1.5;margin:0 0 14px}
.prompt{font-size:28px;font-weight:800;line-height:1.2;margin:14px 0 6px}
.fb{min-height:24px;margin:0 0 12px;font-weight:600}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row button,.lnk{border:2px solid var(--ink);background:none;border-radius:10px;padding:10px 16px;font-weight:600}
.lnk{border:0;padding:6px 0;color:var(--acc)}
.pri{background:var(--acc)!important;border-color:var(--acc)!important;color:#fff!important}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:#C3CCDA}
.dots .d{background:var(--ok)}.dots .c{background:var(--acc)}
.lab{margin:14px 0 6px;font-size:14px;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid #AAB4C4;background:#fff;border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
#kb{background:var(--ink);padding:12px 8px calc(12px + env(safe-area-inset-bottom))}
#sc{overflow-x:auto;overflow-y:hidden;max-width:900px;margin:0 auto}
#piano{position:relative;height:170px;width:max(100%,640px);display:flex;touch-action:pan-x;user-select:none;-webkit-user-select:none}
.w{flex:1;background:#FBFBF8;border:1px solid #8D97A8;border-radius:0 0 8px 8px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:12px;color:var(--mut)}
.b{position:absolute;top:0;width:4%;height:62%;background:#0B1019;border-radius:0 0 6px 6px;z-index:2}
.nn .w span{visibility:hidden}
.w.hint{background:var(--hint)}.b.hint{background:#B8860B}
.w.on{background:#BFD0FF}.b.on{background:#3A4A6B}
.w.ok{background:#9FE3CF}.b.ok{background:#0F7A5F}
.w.bad{background:#F6B3AE}.b.bad{background:#9B2C26}
@media (hover:hover) and (pointer:fine){
.w[data-k]::before{content:attr(data-k);position:absolute;bottom:34px;font-size:11px;font-weight:600;background:#E3E8F0;color:var(--ink);border-radius:4px;padding:1px 6px}
.b[data-k]::before{content:attr(data-k);position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:600;color:#fff}
.w{position:relative}
}
</style>
</head>
<body>
<header>
  <h1>Piano fácil</h1>
  <div class="row">
    <button class="tg" id="bl" aria-pressed="false">Letras C D E</button>
    <button class="tg" id="bn" aria-pressed="true">Nombres en teclas</button>
  </div>
</header>
<nav id="nav">
  <button data-tab="l" aria-selected="true">Lecciones</button>
  <button data-tab="c" aria-selected="false">Acordes</button>
  <button data-tab="f" aria-selected="false">Libre</button>
</nav>
<main id="main"></main>
<div id="kb"><div id="sc"><div id="piano"></div></div></div>

<script>
const $ = s => document.querySelector(s);
const SOL = ["Do","Do♯","Re","Re♯","Mi","Fa","Fa♯","Sol","Sol♯","La","La♯","Si"];
const LET = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
let letters = false, names = true, tab = "l", cur = null;
const nm = m => (letters ? LET : SOL)[((m % 12) + 12) % 12];
const lst = a => a.length < 2 ? a[0] : a.slice(0, -1).join(", ") + " y " + a[a.length - 1];
const LO = 60, HI = 84; // Do4 a Do6
const isBlack = m => [1,3,6,8,10].includes(m % 12);

/* ---------- Datos locales (progreso y registro de uso) ---------- */
const LS = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch (e) { return d } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} };
let prog = LS("pf_prog", {}), ev = LS("pf_ev", []);
function log(type, data) { ev.push({ t: Date.now(), type, ...data }); if (ev.length > 2000) ev.shift(); save("pf_ev", ev); }
function dl() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ progreso: prog, eventos: ev }, null, 1)], { type: "application/json" }));
  a.download = "piano-facil-datos.json"; a.click();
}

/* ---------- Audio ---------- */
let ac; const voices = {}; let dc = 0;
function audio() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === "suspended") ac.resume();
  return ac;
}
function start(m, id) {
  const a = audio(), t = a.currentTime, f = 440 * 2 ** ((m - 69) / 12);
  const g = a.createGain(), g2 = a.createGain(), o1 = a.createOscillator(), o2 = a.createOscillator();
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.26, t + .008); g.gain.exponentialRampToValueAtTime(.06, t + 1.4);
  o1.type = "triangle"; o2.type = "sine"; o1.frequency.value = f; o2.frequency.value = f * 2; g2.gain.value = .35;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(a.destination); o1.start(t); o2.start(t);
  voices[id] = { g, o: [o1, o2] };
}
function stop(id) {
  const v = voices[id]; if (!v) return; const t = ac.currentTime;
  v.g.gain.cancelScheduledValues(t); v.g.gain.setValueAtTime(Math.max(v.g.gain.value, .001), t);
  v.g.gain.exponentialRampToValueAtTime(.0001, t + .25); v.o.forEach(o => o.stop(t + .3)); delete voices[id];
}
function play(ms, hold = 1000) { ms.forEach(m => { const id = "d" + dc++; start(m, id); setTimeout(() => stop(id), hold); }); }
function arp(ms) { ms.forEach((m, i) => setTimeout(() => play([m], 500), i * 450)); }

/* ---------- Teclado ---------- */
const P = $("#piano"), keys = {}, down = {};
{
  const W = 100 / 15; let wi = 0;
  for (let m = LO; m <= HI; m++) {
    const k = document.createElement("div"); k.dataset.m = m;
    if (!isBlack(m)) { k.className = "w"; k.innerHTML = "<span></span>"; wi++; }
    else { k.className = "b"; k.style.left = (wi * W - W * .3) + "%"; }
    P.appendChild(k); keys[m] = k;
  }
}
function refreshNames() {
  P.classList.toggle("nn", !names);
  for (const m in keys) { const s = keys[m].querySelector("span"); if (s) s.textContent = nm(+m); }
}
function setHint(ms) {
  for (const m in keys) keys[m].classList.remove("hint");
  ms.forEach(m => keys[m] && keys[m].classList.add("hint"));
  if (ms.length) keys[ms[0]].scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
}
function flash(m, c) { const k = keys[m]; if (!k) return; k.classList.add(c); setTimeout(() => k.classList.remove(c), 350); }
function press(m, pid) {
  down[pid] = m; keys[m].classList.add("on"); start(m, pid); onPress(m);
}
function release(pid) {
  if (down[pid] == null) return;
  keys[down[pid]].classList.remove("on"); stop(pid); delete down[pid];
}
P.addEventListener("pointerdown", e => { const k = e.target.closest("[data-m]"); if (k) press(+k.dataset.m, e.pointerId); });
["pointerup", "pointercancel", "pointerleave"].forEach(t => P.addEventListener(t, e => release(e.pointerId)));

/* ---------- Teclado del computador ---------- */
const KMAP = { KeyA:0, KeyW:1, KeyS:2, KeyE:3, KeyD:4, KeyF:5, KeyT:6, KeyG:7, KeyY:8, KeyH:9, KeyU:10, KeyJ:11, KeyK:12, KeyO:13, KeyL:14, KeyP:15, Semicolon:16 };
const KLAB = { Semicolon: "Ñ" };
let kbase = 60;
function labelKeys() {
  for (const m in keys) delete keys[m].dataset.k;
  for (const code in KMAP) {
    const m = kbase + KMAP[code];
    if (keys[m]) keys[m].dataset.k = KLAB[code] || code.replace("Key", "");
  }
}
window.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (e.code === "KeyZ" || e.code === "KeyX") {
    kbase = e.code === "KeyZ" ? 60 : 72; labelKeys();
    keys[kbase].scrollIntoView({ inline: "start", block: "nearest", behavior: "smooth" }); return;
  }
  if (!(e.code in KMAP)) return;
  const m = kbase + KMAP[e.code];
  if (!keys[m]) return;
  e.preventDefault(); press(m, "k" + e.code);
});
window.addEventListener("keyup", e => { if (e.code in KMAP) release("k" + e.code); });
window.addEventListener("blur", () => Object.keys(down).forEach(release));
labelKeys();

/* ---------- Voicings ---------- */
function voicing(pcs, bass) {
  let o = pcs;
  if (bass != null) { const i = pcs.indexOf(bass); o = [...pcs.slice(i), ...pcs.slice(0, i)]; }
  const ms = [60 + o[0]];
  for (let j = 1; j < o.length; j++) { const l = ms[ms.length - 1]; ms.push(l + (((o[j] - l % 12) + 12) % 12 || 12)); }
  while (Math.max(...ms) > HI) ms.forEach((_, i) => ms[i] -= 12);
  return ms;
}

/* ---------- Lecciones ---------- */
const n = (...p) => p.map(x => ({ k: "n", p: [x] }));
const c = (p, b) => ({ k: "c", p, b });
const LESSONS = [
  { id: "teclas", t: "Conoce el teclado", d: "Ubica las primeras notas",
    i: () => `Las teclas negras van en grupos de dos y de tres. ${nm(0)} es la tecla blanca justo a la izquierda de cada grupo de dos.`,
    s: n(0, 2, 4, 5, 7) },
  { id: "melodia", t: "Tu primera melodía", d: "Himno a la alegría, primera frase",
    i: () => "Toca las notas en el orden que se pide. No importa en qué octava las toques.",
    s: n(4, 4, 5, 7, 7, 5, 4, 2, 0, 0, 2, 4) },
  { id: "escala", t: "Escala mayor", d: "Sube ocho notas seguidas",
    i: () => "Una escala mayor sube con el patrón tono, tono, semitono, tono, tono, tono, semitono. Empieza en " + nm(0) + " y no te saltes ninguna blanca.",
    s: n(0, 2, 4, 5, 7, 9, 11, 0) },
  { id: "acorde", t: "Tu primer acorde", d: "Tres notas sonando juntas",
    i: () => "Un acorde junta tres notas: la base, la tercera y la quinta. Mantén las teclas apretadas al mismo tiempo.",
    s: [c([0, 4, 7]), c([5, 9, 0]), c([7, 11, 2])] },
  { id: "menor", t: "Acordes menores", d: "El mismo acorde, pero más triste",
    i: () => "Si bajas la tercera medio tono, el acorde mayor se vuelve menor y suena más sombrío.",
    s: [c([9, 0, 4]), c([2, 5, 9]), c([4, 7, 11])] },
  { id: "inv", t: "Inversiones", d: "Misma armonía, otra nota abajo",
    i: () => "Un acorde puede empezar por cualquiera de sus notas. Las inversiones hacen que los cambios de acorde sean más suaves.",
    s: [c([0, 4, 7], 0), c([0, 4, 7], 4), c([0, 4, 7], 7)] },
  { id: "prog", t: "Cuatro acordes", d: "La progresión de miles de canciones",
    i: () => `${lst([0, 7, 9, 5].map(nm))}: esta secuencia suena en muchísimas canciones populares. Toca cada acorde en orden.`,
    s: [c([0, 4, 7]), c([7, 11, 2]), c([9, 0, 4]), c([5, 9, 0])] }
];
const txt = s => s.k === "n" ? `Toca ${nm(s.p[0])}` :
  `Toca juntas ${lst(s.p.map(nm))}` + (s.b != null ? `, con ${nm(s.b)} como la nota más grave` : "");
const stepMidis = s => s.k === "n" ? [60 + s.p[0]] : voicing(s.p, s.b);

function open(id) {
  const L = LESSONS.find(x => x.id === id);
  cur = { l: L, steps: L.s, i: 0, errs: 0, att: 0, t0: Date.now(), lock: false };
  log("lesson_start", { lesson: id }); view();
}
function good() {
  if (cur.lock) return; cur.lock = true; const me = cur;
  log("step", { lesson: me.l.id, step: me.i, ok: 1, att: me.att, ms: Date.now() - me.t0 });
  const f = $("#fb"); f.textContent = "¡Muy bien!"; f.className = "fb ok";
  setTimeout(() => {
    if (cur !== me) return;
    me.i++; me.att = 0; me.t0 = Date.now(); me.lock = false;
    if (me.i >= me.steps.length) {
      me.done = true; prog[me.l.id] = 1; save("pf_prog", prog);
      log("lesson_done", { lesson: me.l.id, errs: me.errs });
    }
    view();
  }, 650);
}
function bad(msg, m) {
  cur.errs++; cur.att++; log("step", { lesson: cur.l.id, step: cur.i, ok: 0, att: cur.att });
  const f = $("#fb"); f.textContent = msg; f.className = "fb bad"; if (m != null) flash(m, "bad");
}
function onPress(m) {
  if (tab !== "l" || !cur || cur.done || cur.lock) return;
  const s = cur.steps[cur.i], held = Object.values(down);
  if (s.k === "n") {
    if (m % 12 === s.p[0]) good(); else bad(`Tocaste ${nm(m)}. Busca ${nm(s.p[0])}.`, m);
  } else {
    if (held.length < s.p.length) return;
    const pcs = [...new Set(held.map(x => x % 12))];
    const okSet = held.length === s.p.length && pcs.length === s.p.length && s.p.every(p => pcs.includes(p));
    const okBass = s.b == null || Math.min(...held) % 12 === s.b;
    if (okSet && okBass) good();
    else bad(okSet ? `Casi: la nota más grave debe ser ${nm(s.b)}.` : "Esas notas no forman el acorde. Prueba con la pista.");
  }
}
function hintNow() {
  const s = cur.steps[cur.i];
  setHint(s.k === "n" ? Object.keys(keys).map(Number).filter(m => m % 12 === s.p[0]) : stepMidis(s));
}
function hearNow() { const s = cur.steps[cur.i]; play(stepMidis(s), 1000); }

/* ---------- Acordes ---------- */
const TYPES = [
  { n: "Mayor", iv: [0, 4, 7] }, { n: "Menor", iv: [0, 3, 7] }, { n: "Séptima", iv: [0, 4, 7, 10] },
  { n: "Menor séptima", iv: [0, 3, 7, 10] }, { n: "Sus4", iv: [0, 5, 7] }
];
const INV = ["Fundamental", "1ª inversión", "2ª inversión", "3ª inversión"];
const ch = { r: 0, t: 0, v: 0 };
function chordNotes() {
  const ms = TYPES[ch.t].iv.map(i => 60 + ch.r + i);
  for (let k = 0; k < ch.v; k++) ms.push(ms.shift() + 12);
  while (Math.max(...ms) > HI) ms.forEach((_, i) => ms[i] -= 12);
  return ms;
}
const chip = (a, i, l, on) => `<button class="chip" data-a="${a}" data-i="${i}" aria-pressed="${on}">${l}</button>`;
function chordHTML() {
  const T = TYPES[ch.t];
  return `<h2>Biblioteca de acordes</h2>
  <p class="lab">Nota base</p><div class="chips">${Array.from({ length: 12 }, (_, i) => chip("root", i, nm(i), ch.r === i)).join("")}</div>
  <p class="lab">Tipo</p><div class="chips">${TYPES.map((t, i) => chip("type", i, t.n, ch.t === i)).join("")}</div>
  <p class="lab">Inversión</p><div class="chips">${T.iv.map((_, i) => chip("inv", i, INV[i], ch.v === i)).join("")}</div>
  <p class="prompt" id="cn"></p>
  <div class="row"><button class="pri" data-a="hearc">Escuchar acorde</button><button data-a="arp">Una nota a la vez</button></div>`;
}
function showChord() {
  const ms = chordNotes(); setHint(ms);
  $("#cn").textContent = `${nm(ch.r)} ${TYPES[ch.t].n.toLowerCase()}: ${ms.map(nm).join(", ")}`;
}

/* ---------- Vistas ---------- */
function listHTML() {
  return `<h2>Lecciones</h2>` + LESSONS.map(L =>
    `<button class="card${prog[L.id] ? " done" : ""}" data-a="open" data-id="${L.id}"><b>${L.t}</b><span>${L.d}${prog[L.id] ? ". Completada" : ""}</span></button>`).join("");
}
function lessonHTML() {
  const L = cur.l;
  if (cur.done) {
    const nx = LESSONS[LESSONS.indexOf(L) + 1];
    return `<h2>Lección completa</h2><p class="info">Terminaste “${L.t}” con ${cur.errs} ${cur.errs === 1 ? "error" : "errores"}.</p>
    <div class="row">${nx ? `<button class="pri" data-a="open" data-id="${nx.id}">Siguiente lección</button>` : ""}<button data-a="back">Volver a las lecciones</button></div>`;
  }
  const s = cur.steps[cur.i];
  return `<button class="lnk" data-a="back">Volver</button><h2>${L.t}</h2><p class="info">${L.i()}</p>
  <div class="dots">${cur.steps.map((_, j) => `<i class="${j < cur.i ? "d" : j === cur.i ? "c" : ""}"></i>`).join("")}</div>
  <p class="prompt">${txt(s)}</p><p class="fb" id="fb" aria-live="polite"></p>
  <div class="row"><button data-a="hint">Ver pista</button><button data-a="hear">Escuchar</button></div>`;
}
function freeHTML() {
  return `<h2>Teclado libre</h2><p class="info">Toca lo que quieras. Puedes mostrar u ocultar los nombres de las notas con el botón de arriba y deslizar el teclado para llegar a otras octavas. En computador también puedes tocar con el teclado: las filas A S D F G H J K L y W E T Y U O P hacen de teclas blancas y negras. Con Z y X cambias de octava.</p>
  <div class="row"><button data-a="dl">Descargar mis datos de práctica</button></div>`;
}
function view() {
  setHint([]);
  document.querySelectorAll("#nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  $("#bl").setAttribute("aria-pressed", letters); $("#bn").setAttribute("aria-pressed", names);
  refreshNames();
  const m = $("#main");
  if (tab === "l") m.innerHTML = cur ? lessonHTML() : listHTML();
  else if (tab === "c") { m.innerHTML = chordHTML(); showChord(); }
  else m.innerHTML = freeHTML();
}

$("#main").addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a, i = +b.dataset.i;
  if (a === "open") open(b.dataset.id);
  else if (a === "back") { cur = null; view(); }
  else if (a === "hint") hintNow();
  else if (a === "hear") hearNow();
  else if (a === "root") { ch.r = i; view(); }
  else if (a === "type") { ch.t = i; ch.v = 0; view(); }
  else if (a === "inv") { ch.v = i; view(); }
  else if (a === "hearc") play(chordNotes(), 1400);
  else if (a === "arp") arp(chordNotes());
  else if (a === "dl") dl();
});
$("#nav").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  tab = b.dataset.tab; cur = null; view();
});
$("#bl").onclick = () => { letters = !letters; view(); };
$("#bn").onclick = () => { names = !names; view(); };
view();
</script>
</body>
</html>
